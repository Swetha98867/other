trigger: none

pool:
  vmImage: ubuntu-latest

steps:

- task: AzureCLI@2
  displayName: Test Azure Service Connection
  inputs:
    azureSubscription: 'q25-secure-azure'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Testing Azure authentication..."

      az account show

      echo "Testing Resource Group access..."

      az group show \
        --name "resource-grp1" \
        --output table

      echo "Service connection test successful."
