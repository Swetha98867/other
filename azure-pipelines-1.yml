trigger: none

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: Build

  jobs:
  - job: BuildJob
    steps:
    - script: |
        echo "Build stage started"
        echo "Build completed"
      displayName: Build


- stage: Terraform
  displayName: Terraform
  dependsOn: Build

  jobs:
  - job: TerraformJob

    steps:

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: latest

    - task: AzureCLI@2
      displayName: Terraform Init Plan Apply
      inputs:
        azureSubscription: 'q25-secure-azure'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          cd q26-terraform

          echo "Terraform Init"
          terraform init

          echo "Terraform Plan"
          terraform plan

          echo "Terraform Apply"
          terraform apply -auto-approve

          echo "Terraform Output"
          terraform output


- stage: Helm
  displayName: Helm Deploy
  dependsOn: Terraform
  condition: succeeded()

  jobs:
  - job: HelmJob

    steps:
    - script: |
        echo "Terraform succeeded"
        echo "Starting Helm deployment"
        helm version
        echo "Helm deployment completed"
      displayName: Helm Deploy