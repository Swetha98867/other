trigger: none

pool:
  vmImage: ubuntu-latest

stages:

# =========================================================
# 1. BUILD STAGE
# =========================================================
- stage: Build
  displayName: Build
  jobs:
  - job: BuildJob
    displayName: Build Application

    steps:
    - checkout: self

    - script: |
        echo "Build stage started"
        echo "Application build completed"
      displayName: Build


# =========================================================
# 2. TERRAFORM STAGE
# =========================================================
- stage: Terraform
  displayName: Terraform Provisioning
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: TerraformJob
    displayName: Terraform Init Plan Apply

    steps:
    - checkout: self

    # Install Terraform
    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'

    # Authenticate with Azure
    - task: AzureCLI@2
      name: terraformOutput
      displayName: Terraform Init Plan Apply
      inputs:
        azureSubscription: 'q25-secure-azure'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true

        inlineScript: |

          echo "================================"
          echo "Azure Authentication"
          echo "================================"

          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_CLIENT_SECRET="$servicePrincipalKey"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          cd "$(Build.SourcesDirectory)/q26-terraform"

          echo "================================"
          echo "Terraform Init"
          echo "================================"

          terraform init

          echo "================================"
          echo "Terraform Plan"
          echo "================================"

          terraform plan

          echo "================================"
          echo "Terraform Apply"
          echo "================================"

          terraform apply -auto-approve

          echo "================================"
          echo "Terraform Outputs"
          echo "================================"

          VM_NAME=$(terraform output -raw vm_name)
          VM_PUBLIC_IP=$(terraform output -raw vm_public_ip)

          echo "VM Name: $VM_NAME"
          echo "VM Public IP: $VM_PUBLIC_IP"

          # Pass Terraform outputs to next stage
          echo "##vso[task.setvariable variable=vmName;isOutput=true]$VM_NAME"
          echo "##vso[task.setvariable variable=vmPublicIP;isOutput=true]$VM_PUBLIC_IP"


# =========================================================
# 3. HELM STAGE
# =========================================================
- stage: Helm
  displayName: Helm Deploy
  dependsOn: Terraform
  condition: succeeded()

  variables:

    # Get Terraform output variables
    vmNameFromTerraform: $[ stageDependencies.Terraform.TerraformJob.outputs['terraformOutput.vmName'] ]

    vmIPFromTerraform: $[ stageDependencies.Terraform.TerraformJob.outputs['terraformOutput.vmPublicIP'] ]

  jobs:
  - job: HelmJob
    displayName: Helm Deployment

    steps:
    - checkout: self

    - script: |
        echo "================================"
        echo "Helm Stage"
        echo "================================"

        echo "Terraform succeeded."

        echo "VM Name received from Terraform:"
        echo "$(vmNameFromTerraform)"

        echo "VM Public IP received from Terraform:"
        echo "$(vmIPFromTerraform)"

        echo "================================"
        echo "Checking Helm"
        echo "================================"

        helm version

        echo "================================"
        echo "Helm Chart"
        echo "================================"

        ls -R "$(Build.SourcesDirectory)/q26-terraform/q26-helm"

        echo "================================"
        echo "Helm Lint"
        echo "================================"

        helm lint "$(Build.SourcesDirectory)/q26-terraform/q26-helm"

        echo "================================"
        echo "Helm Package"
        echo "================================"

        helm package "$(Build.SourcesDirectory)/q26-terraform/q26-helm"

        echo "================================"
        echo "Helm stage completed"
        echo "================================"

      displayName: Helm Validate and Package